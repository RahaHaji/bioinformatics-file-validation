[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinformatics-file-validation"
version = "0.1.0"
description = "Python validators for NGS file formats, starting with FASTQ."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
validate-fastq = "scripts.validate_fastq:main"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
